<div class="bot-backdrop" id="bot-backdrop" hidden></div>
<button class="bot-toggle" type="button" id="bot-toggle" aria-expanded="false" aria-controls="bot" aria-label="Abrir assistente de dúvidas">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5.5h16v10.5H9.5L5 20v-4H4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>
  <span class="bot-toggle-label">Dúvidas</span>
</button>
<section class="bot" id="bot" aria-label="Assistente de dúvidas" hidden>
  <div class="bot-handle" id="bot-handle" aria-hidden="true"></div>
  <header class="bot-head">
    <div class="bot-brand"><svg class="bot-cross" viewBox="0 0 24 40" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 2v36M4 12h16"/></svg>
      <div>
      <p class="bot-eyebrow">Chosen Styles</p>
      <p class="bot-title">Assistente de dúvidas</p>
      </div>
    </div>
    <button class="bot-close" type="button" id="bot-close" aria-label="Fechar assistente">Fechar</button>
  </header>
  <div class="bot-log" id="bot-log" role="log" aria-live="polite"></div>
  <div class="bot-chips" id="bot-chips"></div>
  <form class="bot-form" id="bot-form" autocomplete="off">
    <label class="sr-only" for="bot-input">Escreva sua dúvida</label>
    <input id="bot-input" type="text" maxlength="140" placeholder="Escreva sua dúvida">
    <button class="bot-send" type="submit" aria-label="Enviar pergunta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
  </form>
</section>
