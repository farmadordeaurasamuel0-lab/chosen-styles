<dialog class="search" id="search" aria-labelledby="search-title">
  <div class="search-head">
    <h2 id="search-title" class="display">Buscar</h2>
    <button class="pdp-close" type="button" id="search-close">Fechar</button>
  </div>
  <div class="search-body">
    <label class="search-field">
      <span class="sr-only">Buscar peças</span>
      <input id="search-input" type="search" placeholder="Nome da peça ou palavra" autocomplete="off" maxlength="60">
    </label>
    <p class="search-status" id="search-status" role="status"></p>
    <ul class="search-results" id="search-results"></ul>
  </div>
</dialog>
